<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Тема одна, темна. Тут це кажемо самому документу — щоб смуга
     прокрутки сторінки й полотно під компонентом були тих самих тонів;
     усередині shadow root те саме робить color-scheme у theme-web.css. -->
<meta name="color-scheme" content="dark">
<title>ODD Invest</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!-- «Додати на екран». Маніфест і растрові іконки — усе, що потрібно
     Chrome/Safari для окремого вікна без адресного рядка; service worker
     свідомо не робимо (README: «Чого тут свідомо немає»). Колір смуги
     системи — той самий #12100f, що й тло нижче. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#12100f">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Шрифти. Єдиний CSS, який підключається сторінкою, а не js/styles.js:
     @font-face належить документу й усередині shadow root не реєструється.

     crossorigin обов'язковий навіть на своєму походженні — шрифти завжди
     тягнуться в CORS-режимі, і без атрибута preload качає файл вдруге,
     тобто робить рівно протилежне до задуманого.

     Передвантажуються ДВІ з трьох, і третя пропущена навмисно. Onest несе
     всі підписи, Geist Mono — усі числа: обидві потрібні на першому ж
     кадрі. Source Serif 4 малює саму лише прозу в модалці «як це читати»,
     тобто 48 КіБ, які на більшості відкриттів не знадобляться взагалі, —
     і preload на неї означав би платити за них щоразу. -->
<link rel="preload" href="./fonts/onest-var.v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/geist-mono-var.v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/fonts.css">
<!--
  Хост застосунку. Уся розмітка й логіка — у <odd-invest-app> (js/app.js);
  тут лишається рівно одне: чим компоненту ходити в бекенд.

  Колись цей файл тримав другу, незалежну реалізацію того самого UI на
  півтори тисячі рядків — поруч із бічною панеллю Home Assistant, яка
  мала свою. Вона неминуче відставала: календар був мертвою таблицею без
  статусів виплат, а вивід не екранувався. Спершу реалізації звели в один
  компонент, потім панель прибрали зовсім. Лишилось те, що видно нижче.
-->
<style>
  /* Фон сторінки — до того, як компонент одягнеться: інакше на перший
     кадр блимає біле. Далі тло малює вже сам :host.

     Це єдиний літеральний колір у застосунку, і причина в порядку
     подій: токенів на цей момент ще немає — CSS вантажиться пізніше,
     з js/styles.js. Значення мусить збігатися з --oi-bg. */
  html, body { margin: 0; min-height: 100%; background: #12100f; }
</style>
</head>
<body>
<odd-invest-app></odd-invest-app>
<script type="module">
  import { httpTransport } from "./js/transport.js";
  import { current as currentPortfolio, boot as bootPortfolio } from "./js/portfolio.js";
  import "./js/app.js";

  // ?p=<slug> у адресі — до першого запиту, інакше він піде в головний.
  bootPortfolio();
  const app = document.querySelector("odd-invest-app");
  app.transport = httpTransport("/api/", currentPortfolio);
</script>
</body>
</html>
