# Оновлення залежностей.
#
# Прямих залежностей три, і всі несучі: гроші (go-money), MQTT (paho) і
# драйвер SQLite. Ходити за ними руками означає не ходити зовсім, а тихо
# застаріла бібліотека грошей — не те місце, де хочеться дізнатись про
# виправлену помилку через рік.
#
# github-actions тут не менш важливий: екшени закріплені за SHA коміту
# (з тегом у коментарі), тож самі без нагляду вже не міняються — і саме
# тому оновлювати їх мусить dependabot, він розуміє форму «@sha # vX».
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
