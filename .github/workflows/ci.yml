name: ci
on:
  push: { branches: [main] }
  pull_request:
  # Щотижня — заради вразливостей: нова CVE у net/http зʼявляється без
  # жодного коміту тут, і дізнатись про неї треба не з наступною правкою.
  schedule: [{ cron: "17 5 * * 1" }]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        # Версія одна на всі місця: go.mod, Dockerfile і deploy/proxmox-lxc.sh
        # мали три різні, і «яка в нас насправді» ставало питанням.
        with: { go-version-file: go.mod }

      # Формат — окремим кроком і першим: діф, у якому перемішані правка й
      # вирівнювання, читати неможливо, а gofmt цю різницю прибирає назавжди.
      - name: Формат
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "неформатовані файли:"
            gofmt -l .
            echo "запусти: make fmt"
            exit 1
          fi

      - run: go vet ./...

      # Екшен саме v9: v6 ставить golangci-lint 1.x, який конфіг формату v2
      # (.golangci.yml) відкидає як «invalid elements». Версію лінтера
      # закріплюємо, щоб локальний `make lint` і CI бачили одне й те саме.
      - name: Лінтер
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.12.2 }

      # -race, бо MQTT-публікатор, добовий планувальник і HTTP-сервер ділять
      # один стор: саме та форма програми, де гонку не побачиш очима.
      - run: go test ./... -race -count=1
      # Контракт: фікстура oddinvest/state має бути згенерована поточним кодом.
      # Репозиторій ha-oddinvest у своєму CI підтягує contract/ звідси і ганяє
      # свої парсери проти цих фікстур.
      - run: go test ./internal/state -run TestFixtureUpToDate -count=1

      # Межі коду (Makefile, boundaries): ті самі grep-правила, що й у
      # `make check`. Доти вони жили лише локально.
      - name: Межі коду
        run: make boundaries

  vuln:
    name: Вразливості
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck сам вимагає свіжого Go, тож ставиться на stable, а
      # АНАЛІЗУЄ тулчейном з go.mod — саме тим, яким збирається бойовий
      # (deploy/lxc-deploy.sh бере версію звідти ж). Інакше звіт казав би
      # про стандартну бібліотеку, якої в бінарнику немає.
      #
      # Знайдено ж саме так: go.mod стояв на 1.24.0, і бойовий бінарник ніс
      # 13 досяжних із коду вразливостей net/http, crypto/tls, crypto/x509.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: stable }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck тулчейном бойового
        run: GOTOOLCHAIN="go$(sed -n 's/^go //p' go.mod)" "$(go env GOPATH)/bin/govulncheck" ./...

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Збірки в UI немає навмисно (сервіс ставиться в LXC без Node, модулі
      # віддаються браузеру як є), тож бандлера, який ловив би друкарські
      # помилки, теж немає. Ці три перевірки — його заміна.
      #
      # Відколи панель прибрана, вони ще й ЄДИНА сітка фронтенда: доти
      # частину розбіжностей ловила джоба ui-drift у ha-oddinvest, звіряючи
      # вендорену копію з оригіналом. Другого споживача більше немає — усе,
      # що не впіймають ці кроки, побачить браузер.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }

      # 1. Синтаксис кожного модуля. package.json у каталозі каже node,
      #    що це ESM, а не CommonJS.
      - name: Синтаксис модулів
        working-directory: internal/api/web
        run: |
          for f in $(find js -name '*.js'); do
            node --check "$f" || exit 1
          done

      # 2. Чи резолвиться КОЖЕН імпорт. node --check бачить лише синтаксис і
      #    пропускає «does not provide an export named X» — найімовірнішу
      #    помилку після перейменування чи переносу функції між модулями.
      #
      #    Скрипт лежить у репозиторії, а не heredoc'ом тут: доти цей крок
      #    існував рівно в CI, і `make ui` відтворити його не міг нічим.
      - name: Граф імпортів
        run: node web-imports-check.mjs

      # 3. Чи ВИЗНАЧЕНЕ кожне вжите імʼя. Дві перевірки вище цього не бачать:
      #    модуль із `fmtCur(...)` у тілі й без `fmtCur` у шапці імпорту має
      #    правильний синтаксис, чисто резолвиться — і падає в браузері.
      #    Саме так після розбиття portfolio.js на модулі розділ «Портфель»
      #    поклався на «fmtCur is not defined», а ще два імені зникли тихо.
      #
      #    eslint тут CI-only: ставиться через npx і в застосунок не
      #    потрапляє — правило «жодних залежностей у web/» не порушене.
      - name: Невизначені імена
        run: npx --yes eslint@9 internal/api/web/js

      # 4. Шар токенів. Три перевірки вище дивляться на JS і не бачать CSS
      #    узагалі, а правило «жодного літерала, тільки --oi-*» тримається
      #    рівно на двох умовах: ужитий токен оголошений, оголошений має
      #    споживача. Обидві ламаються тихо — описка в імені змушує CSS
      #    мовчки взяти запасне значення, а мертвий токен читається як
      #    зразок і тиражується.
      - name: Токени CSS
        run: node css-tokens-check.mjs

      # 5. Адреси. Чотири перевірки вище дивляться на синтаксис, імена й
      #    токени — і жодна не бачить, що посилання веде не туди, куди
      #    написано. Адреса тут звичайний рядок: описка в ній синтаксично
      #    бездоганна, резолвиться, проходить eslint, не чіпає токенів, а
      #    невідомий шлях віддає не помилку, а найближчу правдоподібну
      #    сторінку. Саме так три дії черги задач прожили зламаними —
      #    кнопка казала «Подивитись ліміти» й відкривала чергу.
      - name: Адреси
        run: node web-routes-check.mjs

      # 6. Шар кита. Чотири перевірки вище дивляться на СИНТАКСИС і на
      #    токени й не бачать головного: чи користується розділ спільними
      #    будівельниками розмітки взагалі. Рукописна форма проходить їх
      #    усі — вона синтаксично бездоганна й не порушує жодного токена, —
      #    і саме так у застосунку свого часу набралось двадцять шість форм
      #    і двадцять сім таблиць, кожна зі своїми дрібними відхиленнями.
      #
      #    Ціль лежить у Makefile поруч із fx-boundary й sources-boundary:
      #    механіка та сама (grep, без залежностей), і `make ui` ганяє її
      #    локально тим самим кроком.
      - name: Межа кита UI
        run: make ui-kit-boundary
