# Статичний аналіз. Формат конфігу — golangci-lint v2.
#
# Набір свідомо консервативний: тут не стильова поліція, а пошук того, що
# мовчки дає неправильне число. Головний із них — errcheck із check-blank:
# без нього `x, _ := s.st.Foo(ctx)` не помічається взагалі, а саме так
# помилка бази перетворюється на стан із порожнім списком і хибним курсом,
# який потім публікується в MQTT як retained і якому вірить Home Assistant.
#
# Свідомо проковтнута помилка лишається дозволеною — але мусить бути
# названа вголос через //nolint:errcheck із причиною, а не сховатись за
# анонімним підкресленням.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

  settings:
    errcheck:
      # Ловити явні `_` — сенс усієї цієї вправи.
      check-blank: true
      # Виклики, з помилкою яких зробити нічого не можна: відповідь уже
      # пішла в мережу (Write/Encode), або це прибирання в defer, де
      # єдиною реакцією був би лог у нікуди. Тримаємо політику списком в
      # одному місці, а не двома десятками //nolint по всьому коду.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/csv.Writer).Write
        - (*encoding/json.Encoder).Encode
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        - (io.ReadCloser).Close
    misspell:
      locale: US
    staticcheck:
      # QF* — це поради «можна переписати інакше» (тегований switch, закон
      # де Моргана), а не знахідки. Стиль тут свідомий і пояснений у
      # коментарях, тож нехай лінтер шукає дефекти, а не переставляє слова.
      #
      # ST1000/ST1003/ST1020-ST1022 — вимоги до форми англомовних доків
      # («коментар має починатись з імені типу»). Доки тут українські й
      # починаються з тире, тож ці перевірки лише шумлять. Це той самий
      # набір, який golangci-lint вимикає за замовчуванням.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003

  exclusions:
    generated: lax
    rules:
      # У тестах підкреслення — нормальний спосіб сказати «тут не про це»:
      # 52 місця шуму сховали б ті кілька, що справді важать.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
